<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard - Maison Consulting</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="admin-page">
    <div class="admin-container">
        <!-- Header -->
        <div class="admin-header">
            <h1>Admin Dashboard</h1>
            <a href="/logout" class="btn-logout">Logout</a>
        </div>

        <!-- Main Content -->
        <div class="admin-content">
            <h2>All Leads</h2>
            
            <table class="leads-table">
                <thead>
                    <tr>
                        <th>Company Name</th>
                        <th>Contact Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Message</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="leadsTableBody">
                    <!-- Leads will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeEditModal()">&times;</span>
            <h2>Edit Lead</h2>
            
            <form id="editForm">
                <input type="hidden" id="edit_lead_id">
                <input type="text" id="edit_company_name" placeholder="Company Name" required>
                <input type="text" id="edit_contact_name" placeholder="Contact Name" required>
                <input type="email" id="edit_email" placeholder="Email" required>
                <input type="tel" id="edit_phone" placeholder="Phone Number" required>
                <textarea id="edit_message" placeholder="Message" rows="5" required></textarea>
                <button type="submit" class="btn btn-orange">Update</button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='javascript/app.js') }}"></script>
    <script>
        // Load leads from API
        function loadLeads() {
            fetch('/api/get-leads')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('leadsTableBody');
                    tbody.innerHTML = '';
                    
                    if (data.leads && data.leads.length > 0) {
                        data.leads.forEach(lead => {
                            const row = document.createElement('tr');
                            row.innerHTML = `
                                <td>${lead['company_name'] || ''}</td>
                                <td>${lead['contact_name'] || ''}</td>
                                <td>${lead['email'] || ''}</td>
                                <td>${lead['phone'] || ''}</td>
                                <td>${lead['message'] || ''}</td>
                                <td>${lead['created_at'] ? new Date(lead['created_at']).toLocaleDateString() : ''}</td>
                                <td class="actions-cell">
                                    <button class="action-btn edit-btn" onclick="openEditModal(${lead['lead_id']})">✏</button>
                                    <button class="action-btn delete-btn" onclick="deleteLead(${lead['lead_id']})">🗑</button>
                                </td>
                            `;
                            tbody.appendChild(row);
                        });
                    } else {
                        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">No leads found</td></tr>';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('leadsTableBody').innerHTML = '<tr><td colspan="7" style="text-align: center;">Error loading leads</td></tr>';
                });
        }

        // Open edit modal
        function openEditModal(leadId) {
            fetch('/api/get-lead/' + leadId)
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.lead) {
                        const lead = data.lead;
                        document.getElementById('edit_lead_id').value = leadId;
                        document.getElementById('edit_company_name').value = lead['company_name'] || '';
                        document.getElementById('edit_contact_name').value = lead['contact_name'] || '';
                        document.getElementById('edit_email').value = lead['email'] || '';
                        document.getElementById('edit_phone').value = lead['phone'] || '';
                        document.getElementById('edit_message').value = lead['message'] || '';
                        document.getElementById('editModal').style.display = 'block';
                    } else {
                        alert('Error loading lead data: ' + (data.message || 'Lead not found'));
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error loading lead. Check console.');
                });
        }

        // Close edit modal
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        // Update lead - FIXED with admin header
        document.getElementById('editForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const leadId = document.getElementById('edit_lead_id').value;
            const data = {
                company_name: document.getElementById('edit_company_name').value,
                contact_name: document.getElementById('edit_contact_name').value,
                email: document.getElementById('edit_email').value,
                phone: document.getElementById('edit_phone').value,
                message: document.getElementById('edit_message').value
            };
            
            if (confirm('Are you sure you want to update this lead?')) {
                fetch('/api/update-lead/' + leadId, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-ID': '1'
                    },
                    body: JSON.stringify(data)
                })
                .then(response => response.json())
                .then(result => {
                    if (result.success) {
                        alert('Lead updated successfully');
                        closeEditModal();
                        loadLeads();
                    } else {
                        alert('Error updating lead: ' + (result.message || 'Unknown error'));
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error updating lead');
                });
            }
        });

        // Delete lead - FIXED with admin header
        function deleteLead(leadId) {
            if (confirm('Are you sure you want to delete this lead?')) {
                fetch('/api/delete-lead/' + leadId, {
                    method: 'DELETE',
                    headers: {
                        'X-Admin-ID': '1'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('Lead deleted successfully');
                        loadLeads();
                    } else {
                        alert('Error deleting lead: ' + (data.message || 'Unknown error'));
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error deleting lead');
                });
            }
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('editModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        // Load leads on page load
        loadLeads();
    </script>
</body>
</html>
