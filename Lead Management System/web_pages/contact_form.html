<!DOCTYPE html>
<html>
<head>
    <title>Contact Us - Maison Consulting</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="contact-page">
    <div class="contact-container">
        <div class="contact-box">
            <h2>Contact Us</h2>
            
            <form id="contactForm">
                <input type="text" id="company_name" placeholder="Company Name" required>
                <input type="text" id="contact_name" placeholder="Your Name" required>
                <input type="email" id="email" placeholder="example@domain.com" required>
                <input type="tel" id="phone" placeholder="1234-5678910" required>
                 <select id="source" required>
                    <option value="">How did you hear about us?</option>
                    <option value="Website">Website</option>
                    <option value="Referral">Referral</option>
                    <option value="Cold Call">Cold Call</option>
                    <option value="Event">Event</option>
                    <option value="Other">Other</option>
                </select>
                <textarea id="message" placeholder="Your Message" rows="5" required></textarea>
                <button type="submit" class="btn btn-orange">Submit</button>


            </form>
            
            <p id="errorMsg" style="color: red; text-align: center; margin-top: 10px;"></p>
            <a href="/" class="back-link">Back to Home</a>
        </div>
    </div>

   <script src="{{ url_for('static', filename='javascript/app.js') }}"></script>
    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const companyName = document.getElementById('company_name').value;
            const contactName = document.getElementById('contact_name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const source = document.getElementById('source').value;
            const message = document.getElementById('message').value;
            const errorMsg = document.getElementById('errorMsg');
            
            // Clear previous error
            errorMsg.textContent = '';
            
            // Validate all fields
            const validation = validateContactForm(companyName, contactName, email, phone, message);
            
            if (!validation.valid) {
                errorMsg.textContent = validation.message;
                return;
            }
            
            // Validate source is selected
            if (!source) {
                errorMsg.textContent = 'Please select how you heard about us';
                return;
            }
            
            // Submit if valid
            const data = {
                company_name: companyName,
                contact_name: contactName,
                email: email,
                phone: phone,
                source: source,
                message: message
            };
            
            fetch('/api/submit-lead', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    alert('Thank you! Your message has been sent.');
                    document.getElementById('contactForm').reset();
                    errorMsg.textContent = '';
                    window.location.href = '/';
                } else {
                    errorMsg.textContent = 'Error submitting form. Please try again.';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                errorMsg.textContent = 'Error submitting form. Please try again.';
            });
        });
    </script>
</body>
</html>
